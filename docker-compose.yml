services:
  dijital-kutuphane:
    build: .
    container_name: dijital-kutuphane
    ports:
      - "8000:8000"
    volumes:
      - ./veriler:/app/veriler
    env_file:
      - .env
    environment:
      # Container dış ağa açıldığı için .env içinde ACCESS_PASSWORD tanımlanmalıdır!
      - HOST=0.0.0.0
      - PORT=8000
      - AUTO_OPEN_BROWSER=False
    restart: unless-stopped
